name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to commits (Dependabot keeps them current).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.11"}
      - run: sudo apt-get install -y -qq zsh fish
      - name: pre-commit (secrets, PII, lint, format, tests)
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with: {extra_args: --all-files}
      - name: Secrets and PII in the full history (same gitleaks as the hooks)
        run: pre-commit run --hook-stage manual gitleaks-history

  e2e:
    needs: checks
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        base: ["ubuntu:24.04", "ubuntu:26.04", "debian:12", "debian:13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - run: docker build -f tests/e2e/Dockerfile --build-arg BASE=${{ matrix.base }} -t e2e .
      - run: docker run --rm -e GITHUB_TOKEN=${{ github.token }} e2e
