# Overrides for Claude Code cloud environments (claude.ai/code). `./install.sh cloud`
# links config.local.yaml here, so it's merged over config.yaml like any local overlay.
# The VM is root on Ubuntu 24.04, setup must finish in ~5 minutes to be cached, and
# Claude runs non-interactive bash: keep only what Claude itself uses.
# Environment settings to pair it with: CLOUD.md

# node and k8s personas, not python (preinstalled) or ai (Claude is the host here).
profile: {role: server, gpu: false, docker: false, heavy: false, personas: [node, k8s]}
personas:
  node: {apps: []} # Claude Code is already here; list doppler if a project needs it

shells: {default: bash, install: [bash]} # Claude runs bash; fish/zsh add nothing
modules: [cloud] # not git: its credential helper would replace the cloud's GitHub proxy

tools: # the base tools are for interactive terminals; Claude uses none of them
  starship: null
  fzf: null
  zoxide: null
  eza: null
  bat: null
  lazygit: null
  yq: null
  atuin: null
  delta: null
  rtk: latest # compresses command output (hook: CLOUD.md#token-savings)

apps: {timeshift: null}
fonts: []
upgrade: false # a full-upgrade would blow the 5-minute budget
docker: {enabled: false} # preinstalled; this also overrides the personas' need for it
swap: {enabled: false}
nvidia: {enabled: false}
ssh: {generate_key: false}
sudo_nopasswd: false
pre_commit: false
