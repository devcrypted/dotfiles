# Everything ./install.sh does is driven by this file. Edit it and rerun: only the
# differences are applied. Machine-specific overrides go in config.local.yaml
# (gitignored, deep-merged on top; set a key to null there to drop it).
#
# Each machine also has a profile.yaml (gitignored), written by the questions asked on
# the first run: desktop or server, NVIDIA GPU, Docker, heavy apps. It decides which
# `apps` below apply. `./install.sh setup` asks again.

user:
  name: Kamal Kumar
  email: kamal2k89@gmail.com

shells:
  default: fish # login shell
  install: [fish, zsh, bash] # each one gets its config from home/<shell>/

prompt: starship # starship | builtin (no dependencies; shows path, git branch, exit status)

# Dotfile modules to link from home/<module>/ (shell modules follow shells.install).
modules: [git, nvim, tmux, starship, kind, ghostty]

# apt packages from the distro archive, on every machine (desktop apps go in `apps`).
# Removing one here does not uninstall it.
packages:
  - build-essential
  - ca-certificates
  - curl
  - wget
  - unzip
  - git
  - gh
  - htop
  - jq
  - ripgrep
  - fd-find
  - tmux
  - neovim
  - python3
  - python3-pip
  - python3-venv
  - libssl-dev
  - libffi-dev

# Extra apt repositories: {name: {key, url, suite, components, packages}}.
# url/suite/components may use {distro}, {codename}, {version} and {arch}.
apt_repos: {}

# Runtimes and CLI tools managed by mise (https://mise.jdx.dev/registry.html).
# Removing an entry uninstalls it.
tools:
  node: lts
  pnpm: latest
  python: latest
  uv: latest
  kubectl: latest
  kind: latest
  helm: latest
  terraform: latest
  fzf: latest
  zoxide: latest
  eza: latest # modern ls (ll, la, lt)
  bat: latest # cat with syntax highlighting
  starship: latest
  supabase: latest # Supabase CLI (local stack runs in Docker)
  wrangler: latest # Cloudflare Workers/Pages CLI
  rtk: latest # compresses command output for AI agents (hook: CLOUD.md#token-savings)
  # AI coding assistants. Not self-updating: `mise upgrade` refreshes them.
  claude: latest # Claude Code
  opencode: latest
  "npm:cline": latest # Cline CLI (the VS Code extension is separate)

# Applications that only some machines get. `when` lists profile answers that must all
# hold: desktop | server | heavy | docker | gpu (no `when`: every machine). An app may
# use several sources; all of them are installed:
#   apt: [pkg, ...]              distro packages
#   apt_repo: {key, url, suite, components, packages}   a vendor repo (as in apt_repos)
#   flatpak: <Flathub app id>    see flathub.org; installed system-wide
#   deb: {package, url: {amd64: <url>, arm64: <url>}}   a .deb download
#   script: {command, url}       an install script, run unless `command` is on PATH
#   mise: {tool: version}        like `tools`
# Removing an app stops installing it; only its mise tools are uninstalled.
# How-to and examples: MANAGING.md#adding-an-application
apps:
  timeshift: {apt: [timeshift]} # system snapshots: `sudo timeshift --create`
  clipboard: {when: [desktop], apt: [xclip, wl-clipboard]}
  nvtop: {when: [gpu], apt: [nvtop]} # GPU monitor
  brave:
    when: [desktop]
    apt_repo:
      key: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
      url: https://brave-browser-apt-release.s3.brave.com/
      suite: stable
      packages: [brave-browser]
  vscode: # its package adds Microsoft's apt repo, so apt keeps it updated
    when: [desktop]
    deb:
      package: code
      url:
        amd64: https://update.code.visualstudio.com/latest/linux-deb-x64/stable
        arm64: https://update.code.visualstudio.com/latest/linux-deb-arm64/stable
  ghostty: # terminal; .deb builds for Ubuntu 24.04+/Mint 22+/Debian 13+
    when: [desktop]
    script:
      command: ghostty
      url: https://raw.githubusercontent.com/mkasberg/ghostty-ubuntu/HEAD/install.sh
  bitwarden: {when: [desktop], flatpak: com.bitwarden.desktop}
  whatsie: {when: [desktop], flatpak: com.ktechpit.whatsie} # WhatsApp client
  podman-desktop:
    when: [desktop, heavy]
    apt: [podman]
    flatpak: io.podman_desktop.PodmanDesktop
  powershell: {when: [heavy], mise: {powershell: latest}} # needs libicu
  azure-cli: {when: [heavy], mise: {azure: latest}}

fonts: [JetBrainsMono] # Nerd Fonts for prompt icons (skipped on WSL and servers)

# Linux Mint Cinnamon look and feel. Applied only on a desktop profile running Linux
# Mint with Cinnamon installed; everywhere else it is ignored. Besides these lists it
# loads desktop/cinnamon/ (panels, themes, shortcuts, gestures, Nemo, applet settings),
# saved from a configured machine by scripts/mint/cinnamon-capture.sh.
# Applies once, then again only when this section or desktop/cinnamon/ changes.
cinnamon:
  enabled: true
  applets: # from cinnamon-spices.linuxmint.com/applets
    - Cinnamenu@json # menu with search, categories, favorites
    - collapsible-systray@feuerfuchs.eu
    - gpaste-reloaded@feuerfuchs.eu # clipboard history
    - ScreenShot+RecordDesktop@tech71
  themes: # from cinnamon-spices.linuxmint.com/themes
    - Orchis-Dark
    - Adapta
    - Adapta-Nokto
    - CBlack
    - New-Minty
    - Numix-Cinnamon-Semi-Transparent
    - Numix-Cinnamon-Transparent
    - Orchidea
    - Vivaldi
  packages: # apt: icon and cursor themes the settings use, applet dependencies
    - yaru-theme-icon # Yaru-bark icons
    - mint-cursor-themes # Bibata cursors
    - gpaste-2 # for gpaste-reloaded
    - gir1.2-gpaste-2

# Linux Mint debloat and hardening (scripts/mint/harden.sh). Each Mint machine's profile
# chooses the level (asked on the first run: standard | aggressive | none; change it with
# `./install.sh setup` or --harden). Runs once, then again when the level, this section
# or the script changes. Preview it any time: scripts/mint/harden.sh
harden:
  # Sections to leave alone on every machine:
  # debloat, telemetry, services, firewall, kernel, updates, desktop, cleanup
  skip: []

# Aliases become `alias` in bash/zsh and `abbr` in fish.
aliases:
  g: git
  v: nvim
  vim: nvim
  k: kubectl
  h: helm
  tf: terraform
  kgp: kubectl get pods -o wide
  kgn: kubectl get nodes -o wide
  kga: kubectl get pods -o wide -A
  projects: cd ~/projects
  create-cluster: kind create cluster --name kind-main --config ~/.config/kind/cluster.yaml
  delete-cluster: kind delete cluster --name kind-main

env:
  EDITOR: nvim
  VISUAL: nvim

path: [~/.local/bin]

# `mask <command>` pipes output through these sed -E substitutions.
mask:
  - pattern: "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"
    replace: "********-****-****-****-************"

upgrade: true # apt full-upgrade on the first run (again: --rerun upgrade)
# docker and nvidia also need a "yes" in the machine's profile; `false` here vetoes them.
docker:
  enabled: true # an existing docker install (docker.io, Docker Desktop) is kept
nvidia:
  enabled: auto # auto = NVIDIA GPU present and not WSL (WSL uses the Windows driver)
  flavor: open # open | proprietary
  container_toolkit: true # GPU access from Docker containers (when Docker is installed)
  cuda: true # CUDA toolkit from NVIDIA's repo (on WSL too)
ssh:
  generate_key: true # ~/.ssh/id_ed25519 if missing
sudo_nopasswd: true
pre_commit: true # install this repo's commit checks (secrets, PII, lint)
# blocked_words: [...]       # words commits may never contain; set in config.local.yaml
