# Cinnamon settings for `dconf load /`, applied by the cinnamon task.
# Regenerate with scripts/mint/cinnamon-capture.sh; edits by hand are fine too.

[org/cinnamon]
alttab-switcher-delay=100
alttab-switcher-style='icons+preview'
enabled-applets=['panel1:left:0:menu@cinnamon.org:0', 'panel1:right:5:systray@cinnamon.org:3', 'panel1:right:6:xapp-status@cinnamon.org:4', 'panel1:right:7:notifications@cinnamon.org:5', 'panel1:right:8:printers@cinnamon.org:6', 'panel1:right:9:removable-drives@cinnamon.org:7', 'panel1:right:10:keyboard@cinnamon.org:8', 'panel1:right:11:favorites@cinnamon.org:9', 'panel1:right:12:network@cinnamon.org:10', 'panel1:right:13:sound@cinnamon.org:11', 'panel1:right:14:power@cinnamon.org:12', 'panel1:right:15:calendar@cinnamon.org:13', 'panel1:left:2:grouped-window-list@cinnamon.org:15', 'panel1:left:1:spacer@cinnamon.org:16', 'panel1:right:1:gpaste-reloaded@feuerfuchs.eu:18', 'panel1:right:0:collapsible-systray@feuerfuchs.eu:19']
favorite-apps=['org.gnome.Calculator.desktop', 'org.gnome.Calendar.desktop', 'org.x.editor.desktop', 'mintinstall.desktop', 'cinnamon-settings.desktop', 'brave-browser.desktop', 'io.podman_desktop.PodmanDesktop.desktop:flatpak', 'org.gnome.Screenshot.desktop']
next-applet-id=20
panel-zone-symbolic-icon-sizes='[{"panelId": 1, "left": 28, "center": 28, "right": 16}]'
panels-height=['1:40']

[org/cinnamon/desktop/applications/terminal]
exec='ghostty'
exec-arg='-e'

[org/cinnamon/desktop/background]
picture-options='zoom'
picture-uri='file:///usr/share/backgrounds/linuxmint/sele_ring_center_green.jpg'

[org/cinnamon/desktop/background/slideshow]
delay=15
image-source='xml:///usr/share/cinnamon-background-properties/linuxmint.xml'

[org/cinnamon/desktop/input-sources]
sources=[('xkb', 'us')]

[org/cinnamon/desktop/interface]
cursor-blink-time=1200
cursor-theme='Bibata-Modern-Classic'
gtk-theme='Orchis-Dark'
icon-theme='Yaru-bark'

[org/cinnamon/desktop/keybindings]
custom-list=['custom0', '__dummy__']

[org/cinnamon/desktop/keybindings/custom-keybindings/custom0]
binding=['<Primary><Shift><Alt>t']
command='ghostty'
name='Ghostty'

[org/cinnamon/desktop/peripherals/keyboard]
delay=uint32 500
repeat-interval=uint32 30

[org/cinnamon/desktop/screensaver]
layout-group=0

[org/cinnamon/desktop/session]
idle-delay=uint32 0

[org/cinnamon/desktop/sound]
event-sounds=false

[org/cinnamon/desktop/wm/preferences]
min-window-opacity=30

[org/cinnamon/gestures]
swipe-down-2='PUSH_TILE_DOWN::end'
swipe-down-3='TOGGLE_OVERVIEW::end'
swipe-down-4='VOLUME_DOWN::end'
swipe-left-2='PUSH_TILE_LEFT::end'
swipe-left-3='WORKSPACE_NEXT::end'
swipe-left-4='WINDOW_WORKSPACE_PREVIOUS::end'
swipe-right-2='PUSH_TILE_RIGHT::end'
swipe-right-3='WORKSPACE_PREVIOUS::end'
swipe-right-4='WINDOW_WORKSPACE_NEXT::end'
swipe-up-2='PUSH_TILE_UP::end'
swipe-up-3='TOGGLE_EXPO::end'
swipe-up-4='VOLUME_UP::end'
tap-3='MEDIA_PLAY_PAUSE::end'

[org/cinnamon/muffin]
draggable-border-width=10
experimental-features=['scale-monitor-framebuffer', 'x11-randr-fractional-scaling']
tile-maximize=true

[org/cinnamon/muffin/x11]
fractional-scale-mode='scale-ui-down'

[org/cinnamon/theme]
name='Mint-Y-Dark-Red'

[org/nemo/desktop]
show-orphaned-desktop-icons=false
volumes-visible=false

[org/x/apps/portal]
color-scheme='prefer-dark'

[org/x/editor/preferences/ui]
menubar-visible=false
statusbar-visible=false
toolbar-visible=false

[org/x/editor/plugins]
active-plugins=['time', 'textsize', 'spell', 'sort', 'modelines', 'joinlines', 'filebrowser', 'docinfo', 'open-uri-context-menu', 'bracketcompletion']

[org/gnome/desktop/privacy]
disable-camera=false
disable-microphone=false
disable-sound-output=false
old-files-age=uint32 30
recent-files-max-age=7
remember-recent-files=true
remove-old-temp-files=false
remove-old-trash-files=false

[com/linuxmint/updates]
auto-update-cinnamon-spices=true
auto-update-flatpaks=true
autorefresh-hours=2
hide-systray=true
hide-window-after-update=true
refresh-minutes=10
show-welcome-page=false
tracker-grace-period=30
tracker-max-age=15
tracker-max-days=7

[org/gnome/desktop/interface]
gtk-theme='Orchis-Dark'
icon-theme='Yaru-bark'
cursor-theme='Bibata-Modern-Classic'
cursor-size=24
font-name='Ubuntu 10'
