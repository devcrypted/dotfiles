# herdr: keys at herdr.dev/docs/configuration. `herdr --default-config` prints every default.
onboarding = false

[theme]
name = "terminal" # follow the terminal's (Ghostty) colours

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "80%"
height = "80%"
