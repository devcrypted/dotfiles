# herdr: keys at herdr.dev/docs/configuration. `herdr --default-config` prints every default.
onboarding = false

[theme]
name = "catppuccin"

auto_switch = false
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "80%"
height = "80%"

[ui.sound]
enabled = true

[ui.toast]
delivery = "system"
