# Splits and pane navigation
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind l select-pane -R
bind j select-pane -D
bind k select-pane -U
bind -n M-H resize-pane -L 2
bind -n M-J resize-pane -D 2
bind -n M-K resize-pane -U 2
bind -n M-L resize-pane -R 2
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

set -g mouse on
set -g history-limit 50000
set -g allow-rename off
set -g default-terminal "tmux-256color"
set -sg escape-time 10

# Look
set -g pane-border-style 'fg=color233 bg=color234'
set -g pane-active-border-style 'bg=color234 fg=color46'
set -g status-position bottom
set -g status-style 'bg=color233 fg=color15 dim'

# Copy mode (vi keys) to the system clipboard on Wayland or X11.
setw -g mode-keys vi
set -s set-clipboard off
set -s copy-command 'sh -c "if [ -n \"$WAYLAND_DISPLAY\" ]; then wl-copy; else xclip -selection clipboard; fi"'
bind P paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
